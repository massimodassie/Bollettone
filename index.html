    async function initFirebase(customConfig = null) {
      const cfg = customConfig || activeFirebaseConfig;
      if (!cfg) {
        updateSyncBadge('offline', 'Locale');
        render();
        return;
      }

      try {
        unsubscribers.forEach(fn => { try { fn(); } catch (_) {} });
        unsubscribers = [];

        const app = initializeApp(cfg, customConfig ? 'custom-' + Date.now() : undefined);
        auth = getAuth(app);
        db = getFirestore(app);
        try {
          storage = getStorage(app);
        } catch (stErr) {
          console.warn("Firebase Storage non inizializzato:", stErr);
          storage = null;
        }

        if (!customConfig && typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        onAuthStateChanged(auth, (user) => {
          state.user = user;
          if (user) {
            state.cloudConnected = true;
            updateSyncBadge('online', 'Live Sync');
            subscribeToFirestore();
          }
        });
      } catch (err) {
        console.error("Errore connessione Firebase:", err);
        updateSyncBadge('error', 'Offline');
        showToast("Connessione cloud non riuscita. Modalità locale attiva.", "warning");
        render();
      }
    }

    function mergePicksSafely(remotePicks = [], localPicks = []) {
      const map = new Map();
      (Array.isArray(remotePicks) ? remotePicks : []).forEach(pk => {
        if (pk && pk.id) map.set(pk.id, { ...pk });
      });
      (Array.isArray(localPicks) ? localPicks : []).forEach(pk => {
        if (!pk || !pk.id) return;
        const existing = map.get(pk.id);
        if (!existing) {
          map.set(pk.id, { ...pk });
        } else {
          map.set(pk.id, { ...existing, ...pk });
        }
      });
      return Array.from(map.values()).sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
    }

    function normalizeWeekData(data = {}) {
      const batches = Array.isArray(data.playedBatches) ? [...data.playedBatches] : [];
      if (data.activePlay && Array.isArray(data.activePlay.picks) && data.activePlay.picks.length > 0) {
        const alreadyExists = batches.some(b => b.id === (data.activePlay.id || 'legacy_active_play'));
        if (!alreadyExists) {
          batches.unshift({
            id: data.activePlay.id || 'legacy_active_play',
            label: `Giocata · ${formatShortDateTime(data.activePlay.playedAt || Date.now())}`,
            createdAt: data.activePlay.playedAt || Date.now(),
            picks: data.activePlay.picks,
            checkedA: data.activePlay.checkedA || {},
            checkedB: data.activePlay.checkedB || {},
            receipts: data.activePlay.receipts || [],
            receiptCheckReport: data.activePlay.receiptCheckReport || null,
            closedA: data.activePlay.closedA || null,
            closedB: data.activePlay.closedB || null
          });
        }
      }
      return {
        weekLabel: stripDemoText(data.weekLabel || getDefaultWeekLabel()) || getDefaultWeekLabel(),
        picks: Array.isArray(data.picks) ? data.picks : [],
        playedBatches: batches
      };
    }

    function subscribeToFirestore() {
      if (!db || !state.user) return;
      unsubscribers.forEach(fn => { try { fn(); } catch (_) {} });
      unsubscribers = [];

      const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'config');
      const weekRef = doc(db, 'artifacts', appId, 'public', 'data', 'currentWeek', 'active');
      const historyCol = collection(db, 'artifacts', appId, 'public', 'data', 'history');
      const txCol = collection(db, 'artifacts', appId, 'public', 'data', 'transactions');

      unsubscribers.push(
        onSnapshot(settingsRef, (snap) => {
          if (snap.exists()) {
            const data = snap.data();
            if (Array.isArray(data.players) && data.players.length > 0) {
              state.settings.players = data.players;
            }
            if (typeof data.bonusMultipla === 'boolean') {
              state.settings.bonusMultipla = data.bonusMultipla;
            }
            if (typeof data.minQuota === 'number' && data.minQuota >= 1.01) {
              state.settings.minQuota = data.minQuota;
            }
            if (!state.settings.players.some(p => p.id === state.selectedPlayerId)) {
              state.selectedPlayerId = state.settings.players[0]?.id || '';
            }
            render();
          } else {
            saveSettingsToCloud();
          }
        }, (err) => console.error("Errore listener settings:", err))
      );

      unsubscribers.push(
        onSnapshot(weekRef, (snap) => {
          if (snap.exists()) {
            const normalized = normalizeWeekData(snap.data());
            const mergedDraftPicks = isSavingWeek
              ? mergePicksSafely(normalized.picks, state.currentWeek.picks)
              : normalized.picks;

            state.currentWeek = {
              weekLabel: normalized.weekLabel,
              picks: mergedDraftPicks,
              playedBatches: isSavingWeek && state.currentWeek.playedBatches?.length
                ? state.currentWeek.playedBatches
                : normalized.playedBatches
            };

            if (!state.selectedBatchId && state.currentWeek.playedBatches.length > 0) {
              state.selectedBatchId = state.currentWeek.playedBatches[state.currentWeek.playedBatches.length - 1].id;
            }
            render();
          } else {
            saveCurrentWeekToCloud();
          }
        }, (err) => console.error("Errore listener currentWeek:", err))
      );

      unsubscribers.push(
        onSnapshot(historyCol, (snap) => {
          const list = [];
          snap.forEach((d) => {
            const raw = d.data();
            list.push({
              id: d.id,
              ...raw,
              weekLabel: stripDemoText(raw.weekLabel || '')
            });
          });
          list.sort((a, b) => (b.archivedAt || 0) - (a.archivedAt || 0));
          state.history = list;
          render();
        }, (err) => console.error("Errore listener history:", err))
      );

      unsubscribers.push(
        onSnapshot(txCol, (snap) => {
          const list = [];
          snap.forEach((d) => {
            const raw = d.data();
            list.push({
              id: d.id,
              ...raw,
              note: stripDemoText(raw.note || '')
            });
          });
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          state.transactions = list;
          render();
        }, (err) => console.error("Errore listener transactions:", err))
      );
    }

    async function saveCurrentWeekToCloud(forceReplace = false) {
      if (!db || !state.user) return;
      if (isSavingWeek) {
        pendingWeekSave = true;
        return;
      }
      isSavingWeek = true;
      try {
        const weekRef = doc(db, 'artifacts', appId, 'public', 'data', 'currentWeek', 'active');
        let payload = {
          weekLabel: stripDemoText(state.currentWeek.weekLabel) || getDefaultWeekLabel(),
          picks: Array.isArray(state.currentWeek.picks) ? state.currentWeek.picks : [],
          playedBatches: Array.isArray(state.currentWeek.playedBatches) ? state.currentWeek.playedBatches : []
        };

        if (!forceReplace && payload.picks.length > 0) {
          try {
            const snap = await getDoc(weekRef);
            if (snap.exists()) {
              const remoteData = snap.data();
              const remotePicks = Array.isArray(remoteData.picks) ? remoteData.picks : [];
              payload.picks = mergePicksSafely(remotePicks, payload.picks);
              state.currentWeek.picks = payload.picks;
            }
          } catch (_) {}
        }

        await setDoc(weekRef, payload);
      } catch (err) {
        console.error("Errore salvataggio settimana:", err);
        showToast("Errore sincronizzazione settimana su cloud.", "error");
      } finally {
        isSavingWeek = false;
        if (pendingWeekSave) {
          pendingWeekSave = false;
          await saveCurrentWeekToCloud(forceReplace);
        }
      }
    }

    function formatSingleDayESPN(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}${mm}${dd}`;
    }

    function parseESPNEvent(ev, leagueLabel, nowTs) {
      if (!ev || !ev.date) return null;
      const evTs = new Date(ev.date).getTime();
      if (!isNaN(evTs) && evTs < nowTs) return null;

      const comp = ev.competitions?.[0];
      const competitors = comp?.competitors || [];
      const home = competitors.find(c => c.homeAway === 'home')?.team?.displayName || '';
      const away = competitors.find(c => c.homeAway === 'away')?.team?.displayName || '';
      const matchName = (home && away) ? `${home} - ${away}` : (ev.name || 'Partita');

      let formattedDate = '';
      let sortTs = Number.MAX_SAFE_INTEGER;
      try {
        const d = new Date(ev.date);
        sortTs = d.getTime();
        const dd = String(d.getDate()).padStart(2, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const min = String(d.getMinutes()).padStart(2, '0');
        formattedDate = `${dd}/${mm} - ${hh}:${min}`;
      } catch (_) {}

      return {
        id: `${leagueLabel}_${ev.id}`,
        partita: matchName,
        campionato: leagueLabel,
        dataOra: formattedDate,
        sortTs,
        status: ev.status?.type?.shortDetail || ''
      };
    }

    async function fetchSingleLeagueRange(leagueCode, leagueLabel, daysAhead = 14) {
      const nowTs = Date.now() - (2 * 60 * 60 * 1000);
      const daySpan = Math.min(Number(daysAhead) || 14, 30);
      const urls = [`https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueCode}/scoreboard`];

      for (let i = 0; i <= daySpan; i++) {
        urls.push(`https://site.api.espn.com/apis/site/v2/sports/soccer/${leagueCode}/scoreboard?dates=${formatSingleDayESPN(i)}`);
      }

      const responses = await Promise.all(
        urls.map(async (u) => {
          try {
            const res = await fetch(u);
            if (!res.ok) return [];
            const data = await res.json();
            return Array.isArray(data.events) ? data.events : [];
          } catch (_) {
            return [];
          }
        })
      );

      return responses
        .flat()
        .map(ev => parseESPNEvent(ev, leagueLabel, nowTs))
        .filter(Boolean);
    }

    async function fetchLeagueMatches(leagueCode) {
      if (leagueCode === 'custom') {
        state.loadingLeague = false;
        render();
        return;
      }

      const cacheKey = `${leagueCode}_${state.searchDaysAhead}`;
      if (state.leagueMatchesCache[cacheKey]) {
        render();
        return;
      }

      state.loadingLeague = true;
      render();

      try {
        const found = LEAGUES.find(l => l.code === leagueCode);
        const label = found ? found.label.replace(/^[^\w]+/, '').trim() : leagueCode;
        let combined = await fetchSingleLeagueRange(leagueCode, label, state.searchDaysAhead);

        const seen = new Set();
        combined = combined.filter(item => {
          const key = `${normalizeMatch(item.partita)}_${item.dataOra}`;
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        });
        combined.sort((a, b) => a.sortTs - b.sortTs);

        state.leagueMatchesCache[cacheKey] = combined;
      } catch (err) {
        console.warn("Impossibile caricare partite:", err);
        state.leagueMatchesCache[cacheKey] = [];
      } finally {
        state.loadingLeague = false;
        render();
      }
    }

    async function callGeminiWithFallback(payload) {
      const apiKey = (runtimeGeminiKey || "").trim();
      if (!apiKey) {
        throw new Error("Chiave API Gemini mancante. Inseriscila nelle Impostazioni.");
      }
      const models = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-3.5-flash-lite'];
      let lastErr = null;
      for (const modelName of models) {
        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${encodeURIComponent(apiKey)}`;
          return await fetchWithBackoff(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.warn(`Tentativo Gemini fallito su ${modelName}:`, err);
          lastErr = err;
        }
      }
      throw lastErr || new Error("Errore chiamando Gemini API");
    }

    async function analyzeSisalScreenshot(file) {
      if (!file) return;
      state.loadingAI = true;
      state.aiPreviewMatches = null;
      render();

      try {
        const base64Data = await fileToBase64(file);
        const mimeType = file.type || 'image/jpeg';

        const prompt = `Sei un assistente esperto dell'app Sisal Scommesse.
Analizza questo screenshot e estrai tutte le partite di calcio visibili con:
- partita: "Squadra Casa - Squadra Ospite"
- campionato: nome del campionato se visibile (es. "ITA Serie A", "ENG Premier League", altrimenti "")
- mercato: tipo di scommessa (es. "1X2 ESITO FINALE", "DOPPIA CHANCE", "U/O 2.5 + GG/NG", "1X2 + U/O 1.5", "COMBO: DC + GOAL/NOGOAL", "MULTIGOAL 1T + MULTIGOAL 2T")
- esito: la scelta specifica (es. "2", "1X", "GOAL + OVER", "1 + O", "1-4/1-4")
- quota: numero decimale con punto (es. 1.75)
- dataOra: data e ora se presenti (es. "08/11 - 15:00")
Restituisci esclusivamente un JSON valido conforme allo schema.`;

        const payload = {

            role: "user",
            parts: [
              { text: prompt },
              { inlineData: { mimeType, data: base64Data } }
            ]
          }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                matches: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      partita: { type: "STRING" },
                      campionato: { type: "STRING" },
                      mercato: { type: "STRING" },
                      esito: { type: "STRING" },
                      quota: { type: "NUMBER" },
                      dataOra: { type: "STRING" }
                    },
                    required: ["partita", "mercato", "esito", "quota"]
                  }
                }
              },
              required: ["matches"]
            }
          }
        };

        const result = await callGeminiWithFallback(payload);
        const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error("Risposta vuota dall'AI");

        const parsed = JSON.parse(text);
        const matches = Array.isArray(parsed.matches) ? parsed.matches : [];

        if (matches.length === 0) {
          showToast("Nessuna partita riconosciuta. Prova uno screenshot più nitido.", "warning");

          state.aiPreviewMatches = matches;

        }
      } catch (err) {
        console.error("Errore lettura screenshot AI:", err);
        showToast(`Errore AI: ${err.message || "impossibile analizzare lo screenshot."}`, "error");
      } finally {
        state.loadingAI = false;
        render();
      }
    }

    async function verifyReceiptAgainstPicks(base64Data, batchPicks = []) {
      if (!base64Data) return null;
      try {
        const prompt = `Analizza questo cedolino/ricevuta di scommesse Sisal.
Estrai ogni evento/partita giocata sul cedolino con:
- partita: "Squadra Casa - Squadra Ospite"
- mercatoEsito: mercato e pronostico visibili sul cedolino
- quota: quota numerica decimale con punto (es. 1.75)
Restituisci esclusivamente JSON valido conforme allo schema.`;

        const payload = {
          contents: [{
            role: "user",
            parts: [
              { text: prompt },
              { inlineData: { mimeType: 'image/jpeg', data: base64Data } }
            ]
          }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                items: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      partita: { type: "STRING" },
                      mercatoEsito: { type: "STRING" },
                      quota: { type: "NUMBER" }
                    },
                    required: ["partita", "quota"]
                  }
                }
              },
              required: ["items"]
            }
          }
        };

        const result = await callGeminiWithFallback(payload);
        const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) return null;

        const parsed = JSON.parse(text);
        const items = Array.isArray(parsed.items) ? parsed.items : [];
        if (items.length === 0) return null;

        const picks = batchPicks.length > 0 ? batchPicks : (getActiveSchedineBatch().picks || []);
        const matched = [];
        const mismatches = [];
        const unmatched = [];

        items.forEach(item => {
          const foundPick = findBestMatchingPick(item.partita, picks);
          const rQuota = Number(Number(item.quota).toFixed(2));
          if (!foundPick) {
            unmatched.push({
              partita: item.partita,
              mercatoEsito: item.mercatoEsito || '',
              receiptQuota: rQuota
            });
            return;
          }

          const appQuota = Number(Number(foundPick.quota).toFixed(2));
          if (Math.abs(appQuota - rQuota) > 0.009) {
            mismatches.push({
              pickId: foundPick.id,
              partita: foundPick.partita,
              playerName: getPlayerName(foundPick.playerId),
              appQuota,
              receiptQuota: rQuota
            });
          } else {
            matched.push({
              pickId: foundPick.id,
              partita: foundPick.partita,
              quota: rQuota
            });
          }
        });

        return {
          checkedAt: Date.now(),
          totalExtracted: items.length,
          matched,
          mismatches,
          unmatched
        };
      } catch (err) {
        console.warn("Errore verifica quote cedolino:", err);
        return null;
      }
    }

    function findBestMatchingPick(partitaStr, candidatePicks) {
      const normItem = normalizeMatch(partitaStr);
      if (!normItem) return null;

      let exact = candidatePicks.find(pk => {
        const normPk = normalizeMatch(pk.partita);
        return normPk === normItem || normPk.includes(normItem) || normItem.includes(normPk);
      });
      if (exact) return exact;

      const tokens = String(partitaStr || '')
        .toLowerCase()
        .split(/[-–—/]|(?:\bvs\b)/)
        .map(s => s.trim().replace(/[^a-z0-9]/g, ''))
        .filter(t => t.length >= 3);

      if (tokens.length >= 2) {
        exact = candidatePicks.find(pk => {
          const normPk = normalizeMatch(pk.partita);
          return tokens.every(tok => normPk.includes(tok));
        });
        if (exact) return exact;
      }

      if (tokens.length >= 1) {
        exact = candidatePicks.find(pk => {
          const normPk = normalizeMatch(pk.partita);
          return tokens.some(tok => tok.length >= 4 && normPk.includes(tok));
        });
        if (exact) return exact;
      }

      return null;
    }

    async function analyzeResultsScreenshot(file, batchId, ticketType, targetPicks) {
      if (!file || !Array.isArray(targetPicks) || targetPicks.length === 0) return;
      state.loadingResultAI = ticketType;
      state.aiResultPreview = null;
      render();

      try {
        const compressedDataUrl = await compressReceiptImage(file, 1400, 0.85);
        const base64Data = compressedDataUrl.includes(',') ? compressedDataUrl.split(',')[1] : compressedDataUrl;

        const picksContext = targetPicks.map((pk, idx) =>
          `${idx + 1}. ID="${pk.id}" | Partita="${pk.partita}" | Pronostico="${pk.mercato}"`
        ).join('\n');

        const prompt = `Sei un assistente che legge gli screenshot dei risultati di scommesse Sisal (o app risultati calcio).
Ecco le partite presenti in questa schedina:
${picksContext}

Osserva lo screenshot allegato (risultati finali, spunte verdi/rosse, stato Vincente/Perdente o partite non ancora giocate) e valuta ogni partita della lista sopra che riesci a riconoscere nello screen:
- pickId: l'ID esatto della partita corrispondente dalla lista sopra
- partita: nome della partita
- status: "won" se l'esito pronosticato è risultato vincente/preso, "lost" se perdente/sbagliato, oppure "pending" se ancora in corso / non iniziata
- reason: breve motivo (es. "2-1 finale · Presa", "Spunta verde Sisal", "0-0 · Persa", "In corso")
Restituisci esclusivamente JSON valido conforme allo schema.`;

        const payload = {
          contents: [{
            role: "user",
            parts: [
              { text: prompt },
              { inlineData: { mimeType: 'image/jpeg', data: base64Data } }
            ]
          }],
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "OBJECT",
              properties: {
                outcomes: {
                  type: "ARRAY",
                  items: {
                    type: "OBJECT",
                    properties: {
                      pickId: { type: "STRING" },
                      partita: { type: "STRING" },
                      status: { type: "STRING", enum: ["won", "lost", "pending"] },
                      reason: { type: "STRING" }
                    },
                    required: ["partita", "status"]
                  }
                }
              },
              required: ["outcomes"]
            }
          }
        };

        const result = await callGeminiWithFallback(payload);
        const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
        if (!text) throw new Error("Risposta vuota dall'AI");

        const parsed = JSON.parse(text);
        const rawOutcomes = Array.isArray(parsed.outcomes) ? parsed.outcomes : [];

        const previewItems = [];
        const usedIds = new Set();

        rawOutcomes.forEach(o => {
          let matchedPick = targetPicks.find(pk => pk.id === o.pickId);
          if (!matchedPick) {
            matchedPick = findBestMatchingPick(o.partita, targetPicks);
          }
          if (matchedPick && !usedIds.has(matchedPick.id)) {
            usedIds.add(matchedPick.id);
            previewItems.push({
              pickId: matchedPick.id,
              partita: matchedPick.partita,
              mercato: matchedPick.mercato,
              status: ['won', 'lost', 'pending'].includes(o.status) ? o.status : 'pending',
              reason: o.reason || ''
            });
          }
        });

        if (previewItems.length === 0) {
          showToast("Nessun esito abbinato dalle partite di questa schedina. Riprova con uno screen più chiaro.", "warning");
        } else {
          state.aiResultPreview = {
            batchId,
            ticketType,
            items: previewItems
          };
          showToast(`Letti ${previewItems.length} esiti per Schedina ${ticketType}! Controlla e applica.`, "success");
        }
      } catch (err) {
        console.error("Errore verifica AI risultati:", err);
        showToast(`Errore Verifica AI: ${err.message || "impossibile leggere lo screenshot."}`, "error");
      } finally {
        state.loadingResultAI = null;
        render();
      }
    }

    async function fetchWithBackoff(url, options, maxRetries = 3) {
      let delay = 1000;
      for (let i = 0; i < maxRetries; i++) {
        try {
          const res = await fetch(url, options);
          if (res.ok) return await res.json();
          let errDetail = `HTTP ${res.status}`;
          try {
            const errJson = await res.json();
            if (errJson?.error?.message) errDetail = errJson.error.message;
          } catch (_) {}
          if (res.status === 429 || res.status >= 500) {
            await new Promise(r => setTimeout(r, delay));
            delay *= 2;
            continue;
          }
          throw new Error(errDetail);
        } catch (e) {
          if (i === maxRetries - 1) throw e;
          await new Promise(r => setTimeout(r, delay));
          delay *= 2;
        }
      }
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const s = String(reader.result || '');
          resolve(s.includes(',') ? s.split(',')[1] : s);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function compressReceiptImage(file, maxWidth = 1200, quality = 0.78) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const scale = img.width > maxWidth ? maxWidth / img.width : 1;
            const canvas = document.createElement('canvas');
            canvas.width = Math.round(img.width * scale);
            canvas.height = Math.round(img.height * scale);
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function computeTickets(customPicks = null) {
      const players = state.settings.players;
      const picks = Array.isArray(customPicks) ? customPicks : (getActiveSchedineBatch().picks || []);
      const bonusActive = state.settings.bonusMultipla;

      const byPlayer = {};
      players.forEach(p => { byPlayer[p.id] = []; });
      picks.forEach(pk => {
        if (!byPlayer[pk.playerId]) byPlayer[pk.playerId] = [];
        byPlayer[pk.playerId].push(pk);
      });

      const ticketA = [];
      const ticketBBase = [];
      let playersComplete = 0;

      players.forEach(p => {
        const list = (byPlayer[p.id] || []).slice().sort((a, b) => Number(a.quota) - Number(b.quota));
        if (list.length >= 2) playersComplete++;
        if (list.length >= 1) {
          ticketA.push({ ...list[0], playerName: p.name });
        }
        if (list.length >= 2) {
          ticketBBase.push({ ...list[1], playerName: p.name, isJolly: false });
        }
      });

      let jollyFromA = null;
      const ticketB = [...ticketBBase];
      if (ticketA.length > 0) {
        const sortedA = [...ticketA].sort((a, b) => Number(a.quota) - Number(b.quota));
        jollyFromA = { ...sortedA[0], isJolly: true };
        ticketB.push(jollyFromA);
      }

      const stakeA = 5.00;
      const rawProdA = ticketA.length > 0 ? ticketA.reduce((acc, x) => acc * Number(x.quota), 1) : 0;
      const applyBonusA = bonusActive && ticketA.length >= 5;
      const quotaTotA = rawProdA * (applyBonusA ? 1.03 : 1.0);
      const potentialWinA = quotaTotA * stakeA;

      const aLost = ticketA.filter(x => x.status === 'lost').length;
      const aWon = ticketA.filter(x => x.status === 'won').length;
      const aAllResolved = ticketA.length > 0 && (aWon + aLost === ticketA.length);
      let statusA = 'pending';
      let actualWinA = 0;
      if (ticketA.length > 0) {
        if (aLost > 0) {
          statusA = 'lost';
          actualWinA = 0;
        } else if (aWon === ticketA.length) {
          statusA = 'won';
          actualWinA = Number(potentialWinA.toFixed(2));
        }
      }

      const stakeB = 5.00;
      const stake6 = 0.50;
      const stake5 = 0.75;
      const mult6 = bonusActive ? 1.06 : 1.0;
      const mult5 = bonusActive ? 1.03 : 1.0;

      let win6Col = 0;
      let minWinB = 0;
      let maxWinB = 0;
      let cinquineDetails = [];

      if (ticketB.length === 6) {
        const prod6 = ticketB.reduce((acc, x) => acc * Number(x.quota), 1);
        win6Col = prod6 * mult6 * stake6;

        for (let skipIdx = 0; skipIdx < 6; skipIdx++) {
          const combo = ticketB.filter((_, idx) => idx !== skipIdx);
          const comboProd = combo.reduce((acc, x) => acc * Number(x.quota), 1);
          const comboWin = comboProd * mult5 * stake5;
          cinquineDetails.push({
            skipped: ticketB[skipIdx],
            quota: comboProd * mult5,
            win: comboWin,
            allWon: combo.every(c => c.status === 'won')
          });
        }

        minWinB = Math.min(...cinquineDetails.map(c => c.win));
        const sumCinquine = cinquineDetails.reduce((acc, c) => acc + c.win, 0);
        maxWinB = win6Col + sumCinquine;
      } else if (ticketB.length > 0) {
        const prodPartial = ticketB.reduce((acc, x) => acc * Number(x.quota), 1);
        maxWinB = prodPartial * stakeB;
      }

      const bLost = ticketB.filter(x => x.status === 'lost').length;
      const bWon = ticketB.filter(x => x.status === 'won').length;
      const bAllResolved = ticketB.length > 0 && (bWon + bLost === ticketB.length);
      let statusB = 'pending';
      let actualWinB = 0;
      let hitsLabelB = `${bWon}/${ticketB.length} prese`;

      if (ticketB.length === 6) {
        if (bLost >= 2) {
          statusB = 'lost';
          actualWinB = 0;
          hitsLabelB = `${bLost} errori — PERDENTE`;
        } else if (bWon === 6) {
          statusB = 'won';
          actualWinB = Number(maxWinB.toFixed(2));
          hitsLabelB = '6 su 6! (1 sestina + 6 cinquine)';
        } else if (bWon === 5 && bLost === 1) {
          statusB = 'won';
          const hit = cinquineDetails.find(c => c.allWon);
          actualWinB = hit ? Number(hit.win.toFixed(2)) : 0;
          hitsLabelB = '5 su 6! (1 cinquina centrata)';
        }
      } else if (ticketB.length > 0 && bAllResolved) {
        if (bLost >= 2) {
          statusB = 'lost';
          actualWinB = 0;
        } else {
          statusB = 'won';
          actualWinB = Number(maxWinB.toFixed(2));
        }
      }

      return {
        playersCount: players.length,
        playersComplete,
        ticketA: {
          picks: ticketA,
          stake: stakeA,
          applyBonus: applyBonusA,
          quotaTot: quotaTotA,
          potentialWin: potentialWinA,
          status: statusA,
          actualWin: actualWinA,
          wonCount: aWon,
          lostCount: aLost,
          allResolved: aAllResolved
        },
        ticketB: {
          picks: ticketB,
          jolly: jollyFromA,
          stake: stakeB,
          stake6,
          stake5,
          bonusActive,
          win6Col,
          minWin: minWinB,
          maxWin: maxWinB,
          status: statusB,
          actualWin: actualWinB,
          wonCount: bWon,
          lostCount: bLost,
          allResolved: bAllResolved,
          hitsLabel: hitsLabelB
        }
      };
    }

    async function saveNewPick({ partita, campionato, mercato, quota, dataOra }) {
      const playerId = state.selectedPlayerId || state.settings.players[0]?.id;
      if (!playerId) {
        showToast("Seleziona un giocatore.", "error");
        return false;
      }

      if (db && state.user) {
        try {
          const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'currentWeek', 'active'));
          if (snap.exists() && Array.isArray(snap.data().picks)) {
            state.currentWeek.picks = mergePicksSafely(snap.data().picks, state.currentWeek.picks);
          }
        } catch (_) {}
      }

      const playerPicks = state.currentWeek.picks.filter(p => p.playerId === playerId);
      if (playerPicks.length >= 2) {
        showToast(`${getPlayerName(playerId)} ha già inserito 2 partite. Rimuovine una prima.`, "warning");
        return false;
      }

      const normNew = normalizeMatch(partita);
      const duplicateBy = state.currentWeek.picks.find(p => normalizeMatch(p.partita) === normNew);

      state.currentWeek.picks.push({
        id: 'pk_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        playerId,
        campionato,
        partita,
        mercato,
        quota: Number(quota.toFixed(2)),
        dataOra,
        status: 'pending',
        createdAt: Date.now()
      });

      await saveCurrentWeekToCloud();
      render();

      if (duplicateBy) {
        showToast(`Salvata, ma ATTENZIONE: "${partita}" è già stata scelta da ${getPlayerName(duplicateBy.playerId)}!`, "warning");
      } else {
        showToast("Giocata aggiunta al Bollettone!", "success");
      }
      return true;
    }

      for (const file of files) {

            }
          }

          batch.receipts.push({
            id: receiptId,
            name: file.name || 'Cedolino Sisal',
            url: downloadUrl || '',
            dataUrl: downloadUrl ? '' : compressedDataUrl,
            storagePath: savedStoragePath,
            addedAt: Date.now()
          });

          const report = await verifyReceiptAgainstPicks(base64Only, batch.picks);
          if (report) {
            mergedReport.totalExtracted += report.totalExtracted;
            mergedReport.matched.push(...report.matched);
            mergedReport.mismatches.push(...report.mismatches);
            mergedReport.unmatched.push(...report.unmatched);
          }
        } catch (err) {
          console.error("Errore caricamento cedolino:", err);
          showToast("Impossibile allegare un cedolino.", "error");
        }
      }

      if (mergedReport.totalExtracted > 0) {
        batch.receiptCheckReport = mergedReport;
      }

      state.uploadingReceipts = false;
      await saveCurrentWeekToCloud(true);
      render();

      if (mergedReport.mismatches.length > 0) {
        showToast(`Cedolino caricato! Trovate ${mergedReport.mismatches.length} quote diverse da allineare.`, "warning");
      } else if (mergedReport.totalExtracted > 0) {
        showToast("Cedolino caricato e tutte le quote risultano allineate!", "success");
      } else {
        showToast("Cedolino allegato alla puntata!", "success");
      }
    };

    window.recheckExistingReceipt = async function(receiptId) {
      const batch = getActiveSchedineBatch();
      if (!batch || batch.isDraft) return;
      const rc = (batch.receipts || []).find(r => r.id === receiptId);
      if (!rc) return;

      state.checkingReceiptId = receiptId;
      render();

      try {
        let base64Only = '';
        if (rc.dataUrl) {
          base64Only = rc.dataUrl.includes(',') ? rc.dataUrl.split(',')[1] : rc.dataUrl;
        } else if (rc.url) {
          const resp = await fetch(rc.url);
          const blob = await resp.blob();
          base64Only = await fileToBase64(blob);
        }

        const report = await verifyReceiptAgainstPicks(base64Only, batch.picks);
        if (report) {
          batch.receiptCheckReport = report;
          await saveCurrentWeekToCloud(true);
          if (report.mismatches.length > 0) {
            showToast(`Verifica completata: ${report.mismatches.length} quote diverse trovate.`, "warning");
          } else {
            showToast("Verifica completata: tutte le quote coincidono!", "success");
          }
        } else {
          showToast("Impossibile leggere le quote da questo cedolino.", "warning");
        }
      } catch (err) {
        console.error("Errore ri-verifica cedolino:", err);
        showToast("Errore durante il controllo del cedolino.", "error");
      } finally {
        state.checkingReceiptId = null;
        render();
      }
    };

    function copyTextToClipboard(text) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand('copy'); } catch (e) { console.error(e); }
      document.body.removeChild(ta);
    }

    window.confirmSingleTicketClose = async function(batchId, ticketType) {
      const batch = (state.currentWeek.playedBatches || []).find(b => b.id === batchId);
      if (!batch) return;

      const winVal = parseFloat(String(document.getElementById('single-ticket-win-input')?.value || '0').replace(',', '.'));
      const winAmt = isNaN(winVal) ? 0 : Math.max(0, Number(winVal.toFixed(2)));
      const now = Date.now();
      const dateStr = new Date().toLocaleDateString('it-IT');
      const calc = computeTickets(batch.picks);
      const isA = ticketType === 'A';
      const tObj = isA ? calc.ticketA : calc.ticketB;
      const cleanBatchLabel = stripDemoText(batch.label);

      const closedObj = {
        closedAt: now,
        dateStr,
        win: winAmt,
        won: winAmt > 0
      };

      if (isA) batch.closedA = closedObj;
      else batch.closedB = closedObj;

      const picksA = calc.ticketA.picks.map(p => ({ ...p }));
      const picksB = calc.ticketB.picks.map(p => ({ ...p }));

      await addHistoryToCloud({
        weekLabel: `${cleanBatchLabel} · Schedina ${ticketType} (${isA ? 'Secca' : 'Sistema'})`,
        batchId: batch.id,
        ticketType,
        archivedAt: now,
        dateStr,
        picks: isA ? picksA : picksB,
        picksA,
        picksB,
        receipts: (batch.receipts || []).map(r => ({ id: r.id, name: r.name, url: r.url || '' })),
        schedinaA: isA ? {
          quotaTot: Number(tObj.quotaTot.toFixed(2)),
          potentialWin: Number(tObj.potentialWin.toFixed(2)),
          actualWin: winAmt,
          won: winAmt > 0
        } : null,
        schedinaB: !isA ? {
          minWin: Number(tObj.minWin.toFixed(2)),
          maxWin: Number(tObj.maxWin.toFixed(2)),
          actualWin: winAmt,
          hitsLabel: tObj.hitsLabel,
          won: winAmt > 0
        } : null,
        totalStake: 5.00,
        totalWin: winAmt
      });

      await addTransactionToCloud({
        type: 'bet',
        amount: -5.00,
        note: `Costo Schedina ${ticketType} (${cleanBatchLabel})`,
        date: dateStr,
        createdAt: now
      });

      if (winAmt > 0) {
        await addTransactionToCloud({
          type: 'win',
          amount: winAmt,
          note: `Vincita Schedina ${ticketType} (${cleanBatchLabel})`,
          date: dateStr,
          createdAt: now + 1
        });
      }

      if (batch.closedA && batch.closedB) {
        state.currentWeek.playedBatches = (state.currentWeek.playedBatches || []).filter(b => b.id !== batch.id);
        const remaining = state.currentWeek.playedBatches;
        state.selectedBatchId = remaining.length > 0 ? remaining[remaining.length - 1].id : null;
      }

      await saveCurrentWeekToCloud(true);
      closeModal();
      render();
      showToast(`Schedina ${ticketType} chiusa e salvata in PUNTATE!`, "success");
    };

      if (fbStr) {

          showToast("Configurazione Firebase applicata!", "success");

    window.addPlayerInSettings = async function() {
      state.settings.players.push({ id: 'p_' + Date.now(), name: `Collega ${state.settings.players.length + 1}` });
      await saveSettingsToCloud();
      openSettingsModal();
      render();
    };

    window.removePlayerInSettings = async function(pid) {
      state.settings.players = state.settings.players.filter(p => p.id !== pid);
      await saveSettingsToCloud();
      openSettingsModal();
      render();
    };

    window.saveSettingsModal = async function() {
      const inputs = document.querySelectorAll('.settings-player-input');
      const updated = [];
      inputs.forEach(inp => {
        updated.push({ id: inp.getAttribute('data-player-id'), name: inp.value.trim() || 'Giocatore' });
      });
      state.settings.players = updated;

      const bonusEl = document.getElementById('settings-bonus-toggle');
      if (bonusEl) state.settings.bonusMultipla = bonusEl.checked;

      const weekEl = document.getElementById('settings-week-label');
      if (weekEl && weekEl.value.trim()) state.currentWeek.weekLabel = stripDemoText(weekEl.value.trim()) || getDefaultWeekLabel();

      const minQuotaInput = document.getElementById('cfg-min-quota');
      if (minQuotaInput) {
        const parsedMinQ = parseFloat(String(minQuotaInput.value).replace(',', '.'));
        state.settings.minQuota = (!isNaN(parsedMinQ) && parsedMinQ >= 1.01) ? parsedMinQ : 1.40;
      }

      await saveSettingsToCloud();
      await saveCurrentWeekToCloud(false);
      closeModal();
      render();
      showToast("Impostazioni salvate!", "success");
    };

    window.resetCurrentWeekOnly = async function() {
      state.currentWeek.picks = [];
      state.currentWeek.playedBatches = [];
      state.selectedBatchId = null;
      await saveCurrentWeekToCloud(true);
      closeModal();
      render();
      showToast("Bozza e puntate in corso svuotate.", "info");

    function render() {
      const lbl = document.getElementById('header-week-label');
      if (lbl) lbl.textContent = stripDemoText(state.currentWeek.weekLabel);

      ['gioca', 'schedine', 'puntate', 'cassa', 'statistiche'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (!btn) return;
        if (state.activeTab === t) {
          btn.classList.add('text-[#FF6B7D]', 'bg-[#C8102E]/15');
          btn.classList.remove('text-gray-500');
        } else {
          btn.classList.remove('text-[#FF6B7D]', 'bg-[#C8102E]/15');
          btn.classList.add('text-gray-500');
        }
      });

      const activeBatch = getActiveSchedineBatch();
      const calc = computeTickets(activeBatch.picks);
      const badgeSched = document.getElementById('badge-schedine');
      if (badgeSched) {
        if (calc.ticketA.picks.length >= 5 && calc.ticketB.picks.length >= 6) badgeSched.classList.remove('hidden');
        else badgeSched.classList.add('hidden');
      }

      const main = document.getElementById('main-content');
      if (!main) return;

      if (state.activeTab === 'gioca') main.innerHTML = renderGiocaTab(computeTickets(state.currentWeek.picks || []));
      else if (state.activeTab === 'schedine') main.innerHTML = renderSchedineTab();
      else if (state.activeTab === 'puntate') main.innerHTML = renderPuntateStoricoTab();
      else if (state.activeTab === 'cassa') main.innerHTML = renderCassaTab();
      else if (state.activeTab === 'statistiche') main.innerHTML = renderStatisticheTab();
    }

    function buildESPNMatchesListHtml() {
      if (state.selectedLeague === 'custom') return '';
      if (state.loadingLeague) {
        return `<div class="py-3 text-center text-xs text-gray-400">Ricerca partite in programma nei prossimi ${state.searchDaysAhead} giorni...</div>`;
      }

      const cacheKey = `${state.selectedLeague}_${state.searchDaysAhead}`;
      const list = state.leagueMatchesCache[cacheKey] || [];
      const q = state.matchSearchQuery.trim().toLowerCase();

      if (list.length === 0) {
        return `<div class="py-2.5 px-3 rounded-xl bg-[#121212] text-[11px] text-gray-500">Nessuna partita trovata nell'arco dei prossimi ${state.searchDaysAhead} giorni. Puoi scriverla a mano qui sotto.</div>`;
      }

      const filtered = q
        ? list.filter(m =>
            m.partita.toLowerCase().includes(q) ||
            (m.campionato || '').toLowerCase().includes(q)
          )
        : list;

      if (filtered.length === 0) {
        return `<div class="py-2.5 px-3 text-[11px] text-gray-500">Nessuna partita trovata per "${escapeHtml(state.matchSearchQuery)}" nei prossimi ${state.searchDaysAhead} giorni.</div>`;
      }

      return `
        <div class="max-h-48 overflow-y-auto space-y-1.5 pr-1">
          ${filtered.slice(0, 40).map(m => `
            <button type="button" onclick="selectMatchFromESPN('${escapeJs(m.partita)}', '${escapeJs(m.dataOra)}')"
              class="w-full text-left px-3 py-2 rounded-xl bg-[#121212] hover:bg-[#2a1c20] border border-white/5 flex items-center justify-between gap-2 transition">
              <div class="min-w-0">
                <div class="text-xs font-semibold text-white truncate">${escapeHtml(m.partita)}</div>
                ${m.campionato ? `<div class="text-[10px] text-gray-500 truncate">${escapeHtml(m.campionato)}</div>` : ''}
              </div>
              <span class="text-[10px] font-medium text-[#FF6B7D] shrink-0">${escapeHtml(m.dataOra || m.status)}</span>
            </button>
          `).join('')}
        </div>
      `;
    }

              <div class="col-span-2">

                <select onchange="onLeagueChange(this.value)"
                  class="w-full px-3 py-2.5 rounded-xl bg-[#121212] border border-white/15 text-white text-xs font-bold focus:outline-none focus:border-[#C8102E]">
                  ${LEAGUES.map(l => `<option value="${l.code}" ${state.selectedLeague === l.code ? 'selected' : ''}>${l.label}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="text-[11px] font-bold text-gray-400 block mb-1">Orizzonte</label>
                <select onchange="onSearchDaysChange(this.value)"
                  class="w-full px-2 py-2.5 rounded-xl bg-[#121212] border border-white/15 text-white text-xs font-bold focus:outline-none focus:border-[#C8102E]">
                  <option value="7" ${state.searchDaysAhead === 7 ? 'selected' : ''}>7 gg</option>
                  <option value="14" ${state.searchDaysAhead === 14 ? 'selected' : ''}>14 gg</option>
                  <option value="30" ${state.searchDaysAhead === 30 ? 'selected' : ''}>30 gg</option>
                </select>
              </div>
            </div>

            ${state.selectedLeague !== 'custom' ? `
              <input type="text" placeholder="🔍 2. Cerca squadra (es. Milan, Juve, Chelsea)..."
                value="${escapeHtml(state.matchSearchQuery)}"
                oninput="onMatchSearchInput(this.value)"
                class="w-full px-3 py-2 rounded-xl bg-[#121212] border border-white/10 text-white text-xs placeholder-gray-600 focus:outline-none focus:border-[#C8102E]" />
              <div id="espn-matches-list">
                ${buildESPNMatchesListHtml()}
              </div>
            ` : ''}
          </div>

          <form onsubmit="submitPickForm(event)" class="space-y-3">
            <div>
              <label class="block text-[11px] font-semibold text-gray-400 mb-1">2. Partita (selezionata o manuale)</label>
              <input type="text" required placeholder="Es. Genoa - Milan  oppure  Vicenza - Cremonese"
                value="${escapeHtml(state.form.partita)}"
                oninput="updateFormField('partita', this.value)"
                class="w-full px-3.5 py-2.5 rounded-xl bg-[#121212] border border-white/15 text-white text-sm font-semibold placeholder-gray-600 focus:outline-none focus:border-[#C8102E]" />
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              <div>
                <label class="block text-[11px] font-semibold text-gray-400 mb-1">3. Tipologia Scommessa</label>
                <select onchange="onMarketChange(this.value)"
                  class="w-full px-3 py-2.5 rounded-xl bg-[#121212] border border-white/15 text-white text-xs font-semibold focus:outline-none focus:border-[#C8102E]">
                  ${MARKETS.map(m => `<option value="${m.key}" ${state.form.mercato === m.key ? 'selected' : ''}>${m.label}</option>`).join('')}
                </select>
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-gray-400 mb-1">Esito Specifico</label>
                <input type="text" required placeholder="Es. 2, 1X, GOAL + OVER"
                  value="${escapeHtml(state.form.esito)}"
                  oninput="updateFormField('esito', this.value)"
                  class="w-full px-3.5 py-2.5 rounded-xl bg-[#121212] border border-white/15 text-white text-sm font-semibold placeholder-gray-600 focus:outline-none focus:border-[#C8102E]" />
              </div>
            </div>

            <div class="flex flex-wrap gap-1.5">
              ${activeMarketObj.suggestions.map(s => `
                <button type="button" onclick="selectOutcomeSuggestion('${escapeJs(s)}')"
                  class="px-2.5 py-1 rounded-lg text-[11px] font-bold border transition ${
                    state.form.esito === s
                      ? 'bg-[#C8102E] text-white border-[#C8102E]'
                      : 'bg-[#121212] text-gray-300 border-white/10 hover:border-[#C8102E]/50'
                  }">${escapeHtml(s)}</button>
              `).join('')}
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-[11px] font-semibold text-gray-400 mb-1">4. Quota Sisal (min. ${minQ.toFixed(2)})</label>
                <input type="number" step="0.01" min="${minQ.toFixed(2)}" required placeholder="1.75"
                  value="${escapeHtml(state.form.quota)}"
                  oninput="updateFormField('quota', this.value)"
                  class="w-full px-3.5 py-2.5 rounded-xl bg-[#121212] border border-white/15 text-[#FF6B7D] font-black text-base placeholder-gray-600 focus:outline-none focus:border-[#C8102E]" />
              </div>
              <div>
                <label class="block text-[11px] font-semibold text-gray-400 mb-1">Data / Ora (opz.)</label>
                <input type="text" placeholder="Es. 08/11 - 15:00"
                  value="${escapeHtml(state.form.dataOra)}"
                  oninput="updateFormField('dataOra', this.value)"
                  class="w-full px-3.5 py-2.5 rounded-xl bg-[#121212] border border-white/15 text-white text-sm placeholder-gray-600 focus:outline-none focus:border-[#C8102E]" />
              </div>
            </div>

            <div id="quota-warning" class="${showQuotaWarn ? '' : 'hidden'} p-2.5 rounded-xl bg-red-500/15 border border-red-500/40 text-red-300 text-xs font-bold">
              ⛔ Regola Bollettone: non sono ammesse quote inferiori a ${minQ.toFixed(2)}!
            </div>

            <button type="submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-[#C8102E] to-[#9E0B22] hover:from-[#E01938] hover:to-[#B50D28] text-white font-extrabold text-sm transition active:scale-[0.98]">
              + Aggiungi Puntata per ${escapeHtml(getPlayerName(state.selectedPlayerId))}
            </button>
          </form>
        </div>

        <div class="space-y-2.5">
          <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Giocate Nuova Giornata (${picks.length})</h2>
          ${picksListHtml}
        </div>
      `;
    }

    function renderSchedineTab() {
      const batches = Array.isArray(state.currentWeek.playedBatches) ? state.currentWeek.playedBatches : [];
      const draftPicks = Array.isArray(state.currentWeek.picks) ? state.currentWeek.picks : [];

      if (batches.length === 0 && draftPicks.length === 0) {
        return `
          <div class="text-center py-12 px-5 rounded-3xl bg-[#1C1517] border border-white/10">
            <div class="text-4xl mb-3">🎫</div>
            <h2 class="text-lg font-black text-white">Nessuna schedina da verificare</h2>
            <p class="text-xs text-gray-400 mt-1.5 max-w-xs mx-auto">Inserisci le partite nella tab GIOCA e premi <strong>Segna come Giocata</strong> per trovarle qui.</p>
            <button onclick="switchTab('gioca')" class="mt-5 px-5 py-3 rounded-xl bg-[#C8102E] text-white font-extrabold text-xs">Vai a GIOCA</button>
          </div>
        `;
      }

      const currentBatch = getActiveSchedineBatch();
      const isDraftView = !!currentBatch.isDraft;
      const calc = computeTickets(currentBatch.picks);
      const receipts = Array.isArray(currentBatch.receipts) ? currentBatch.receipts : [];
      const report = currentBatch.receiptCheckReport;
      const mismatchMap = {};
      if (report && Array.isArray(report.mismatches)) {
        report.mismatches.forEach(m => { mismatchMap[m.pickId] = m; });
      }

      const batchSelectorHtml = `
        <div class="rounded-3xl bg-[#1C1517] border border-[#C8102E]/30 p-3.5 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-[11px] font-extrabold uppercase tracking-wider text-gray-400">Seleziona Puntata / Sessione</span>
            <span class="text-[10px] text-[#FF6B7D] font-bold">${batches.length} giocat${batches.length === 1 ? 'a' : 'e'}</span>
          </div>
          <div class="flex sm:grid sm:grid-cols-3 gap-2 overflow-x-auto no-scrollbar pb-1">
            ${batches.map(b => {
              const isSel = !isDraftView && currentBatch.id === b.id;
              const cleanBLabel = stripDemoText(b.label);
              const statusTxt = (b.closedA || b.closedB)
                ? `A:${b.closedA ? 'Chiusa' : 'Aperta'} · B:${b.closedB ? 'Chiusa' : 'Aperta'}`
                : 'Giocata · Da verificare';
              return `
                <button type="button" onclick="selectBatchInSchedine('${b.id}')"
                  class="shrink-0 sm:shrink text-left p-2.5 rounded-2xl border transition ${
                    isSel
                      ? 'bg-[#C8102E]/20 border-[#C8102E] text-white'
                      : 'bg-[#121212] hover:bg-[#261C1F] border-white/10 text-gray-300'
                  }">
                  <div class="text-xs font-extrabold truncate">${escapeHtml(cleanBLabel)}</div>
                  <div class="text-[10px] text-gray-400 truncate mt-0.5">${escapeHtml(statusTxt)}</div>
                </button>
              `;
            }).join('')}

            ${draftPicks.length > 0 ? `
              <button type="button" onclick="selectBatchInSchedine('draft')"
                class="shrink-0 sm:shrink text-left p-2.5 rounded-2xl border transition ${
                  isDraftView
                    ? 'bg-amber-400/15 border-amber-400 text-white'
                    : 'bg-[#121212] hover:bg-[#261C1F] border-white/10 text-gray-300'
                }">
                <div class="text-xs font-extrabold truncate text-amber-300">📝 Bozza Nuova Giornata</div>
                <div class="text-[10px] text-gray-400 truncate mt-0.5">${draftPicks.length} partite · Non ancora giocata</div>
              </button>
            ` : ''}
          </div>
        </div>
      `;

      const renderTicketRow = (pk, ticketType, isTicketClosed) => {
        const isChecked = !!(currentBatch[ticketType === 'A' ? 'checkedA' : 'checkedB']?.[pk.id]);
        const mm = mismatchMap[pk.id];
        return `
          <div class="p-3.5 border-b border-white/5 last:border-0 transition ${mm ? 'bg-amber-500/10' : isChecked ? 'bg-[#C8102E]/5' : ''}">
            <div class="flex items-start gap-3">
              <button onclick="toggleCheckSisal('${ticketType}', '${pk.id}')" ${isDraftView ? 'disabled' : ''} title="Spunta quando inserita su Sisal"
                class="mt-0.5 w-5 h-5 rounded-md border flex items-center justify-center shrink-0 transition ${
                  isChecked ? 'bg-[#C8102E] border-[#C8102E] text-white' : 'border-gray-600 bg-[#121212] text-transparent'
                }">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
                </svg>
              </button>

              <div class="min-w-0 flex-1">
                <div class="flex items-center justify-between gap-2">
                  <span class="font-bold text-sm text-white truncate ${isChecked ? 'line-through opacity-60' : ''}">${escapeHtml(pk.partita)}</span>
                  <div class="flex items-center gap-1 shrink-0">
                    <span class="text-[10px] text-gray-500">@</span>
                    <input type="number" step="0.01" min="1.01" value="${Number(pk.quota).toFixed(2)}"
                      ${isTicketClosed || isDraftView ? 'disabled' : ''}
                      title="Quota definitiva (modifica dopo lettura cedolino)"
                      onchange="updatePickFinalQuota('${pk.id}', this.value)"
                      class="w-16 px-1.5 py-0.5 rounded-lg bg-[#121212] border ${mm ? 'border-amber-400 text-amber-300' : 'border-white/15 text-[#FF6B7D]'} font-black text-xs text-right focus:outline-none focus:border-[#C8102E]" />
                  </div>
                </div>
                <div class="flex items-center justify-between gap-2 mt-0.5">
                  <span class="text-xs text-gray-400 truncate">${escapeHtml(pk.mercato)}</span>
                  <span class="text-[10px] text-gray-500 shrink-0">${escapeHtml(pk.dataOra || '')}</span>
                </div>

                ${mm && !isTicketClosed && !isDraftView ? `
                  <div class="mt-2 p-2 rounded-lg bg-amber-500/15 border border-amber-500/30 flex items-center justify-between gap-2">
                    <span class="text-[11px] text-amber-300 font-semibold">
                      ⚠️ Cedolino: <strong>${mm.receiptQuota.toFixed(2)}</strong> (in app: ${mm.appQuota.toFixed(2)})
                    </span>
                    <button type="button" onclick="updatePickFinalQuota('${pk.id}', '${mm.receiptQuota}')"
                      class="px-2 py-1 rounded-md bg-amber-400 text-[#121212] font-extrabold text-[10px] shrink-0">
                      Allinea a ${mm.receiptQuota.toFixed(2)}
                    </button>
                  </div>
                ` : ''}

                <div class="flex items-center justify-between gap-2 mt-2.5">
                  <div class="flex items-center gap-1.5 min-w-0">
                    <span class="px-2 py-0.5 rounded bg-white/5 text-[10px] font-semibold text-gray-300 truncate">${escapeHtml(pk.playerName)}</span>
                    ${pk.isJolly ? `<span class="px-2 py-0.5 rounded bg-[#C8102E]/25 text-[#FF8A98] text-[10px] font-bold shrink-0">⭐ Da Schedina A</span>` : ''}
                  </div>
                  <div class="flex items-center gap-1.5 shrink-0">
                    <button onclick="setPickStatus('${pk.id}', 'won')" ${isTicketClosed || isDraftView ? 'disabled' : ''}
                      class="px-2.5 py-1 rounded-lg text-[11px] font-bold border transition disabled:opacity-50 ${
                        pk.status === 'won'
                          ? 'bg-[#22C55E] text-[#09150D] border-[#22C55E]'
                          : 'bg-[#121212] text-gray-400 border-white/10 hover:text-[#4ADE80]'
                      }">✅ Presa</button>
                    <button onclick="setPickStatus('${pk.id}', 'lost')" ${isTicketClosed || isDraftView ? 'disabled' : ''}
                      class="px-2.5 py-1 rounded-lg text-[11px] font-bold border transition disabled:opacity-50 ${
                        pk.status === 'lost'
                          ? 'bg-[#C8102E] text-white border-[#FF6B7D]'
                          : 'bg-[#121212] text-gray-400 border-white/10 hover:text-[#FF6B7D]'
                      }">❌ Persa</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      };

      const renderAIResultPreviewBox = (ticketType) => {
        if (!state.aiResultPreview || state.aiResultPreview.ticketType !== ticketType || state.aiResultPreview.batchId !== currentBatch.id) return '';
        const items = state.aiResultPreview.items || [];
        return `
          <div class="m-3 p-3 rounded-2xl bg-[#121212] border border-[#C8102E]/50 space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-xs font-extrabold text-[#FF6B7D]">🤖 Esiti letti da Screen — Schedina ${ticketType}</span>
              <button type="button" onclick="dismissAIResultPreview()" class="text-xs text-gray-400 hover:text-white">✕</button>
            </div>
            <div class="space-y-1.5">
              ${items.map((it, idx) => {
                const stBadge = it.status === 'won'
                  ? '<span class="px-2 py-0.5 rounded bg-[#22C55E] text-[#09150D] font-black text-[10px]">✅ Presa</span>'
                  : it.status === 'lost'
                    ? '<span class="px-2 py-0.5 rounded bg-[#C8102E] text-white font-black text-[10px]">❌ Persa</span>'
                    : '<span class="px-2 py-0.5 rounded bg-amber-400/20 text-amber-300 font-bold text-[10px]">⏳ In attesa</span>';
                return `
                  <div class="p-2 rounded-xl bg-[#1C1517] border border-white/10 flex items-center justify-between gap-2">
                    <div class="min-w-0">
                      <div class="text-xs font-bold text-white truncate">${escapeHtml(it.partita)}</div>
                      <div class="text-[10px] text-gray-400 truncate">${escapeHtml(it.mercato)}${it.reason ? ' · ' + escapeHtml(it.reason) : ''}</div>
                    </div>
                    <button type="button" onclick="cycleAIResultPreviewStatus(${idx})" title="Tocca per cambiare stato" class="shrink-0">
                      ${stBadge}
                    </button>
                  </div>
                `;
              }).join('')}
            </div>
            <button type="button" onclick="applyAIResultPreview()"
              class="w-full py-2.5 rounded-xl bg-gradient-to-r from-[#C8102E] to-[#9E0B22] hover:from-[#E01938] hover:to-[#B50D28] text-white font-extrabold text-xs transition">
              Applica esiti a Schedina ${ticketType}
            </button>
          </div>
        `;
      };

      const closedA = currentBatch.closedA;
      const closedB = currentBatch.closedB;

      const aBadge = closedA
        ? `<span class="px-2.5 py-1 rounded-lg ${closedA.win > 0 ? 'bg-[#22C55E] text-[#09150D]' : 'bg-[#C8102E]/25 text-[#FF6B7D]'} text-xs font-black">CHIUSA ${closedA.win > 0 ? '+' + formatEuro(closedA.win) : '0,00 €'}</span>`
        : calc.ticketA.status === 'won'
          ? `<span class="px-2.5 py-1 rounded-lg bg-[#22C55E] text-[#09150D] text-xs font-black">VINCENTE ${formatEuro(calc.ticketA.actualWin)}</span>`
          : calc.ticketA.status === 'lost'
            ? `<span class="px-2.5 py-1 rounded-lg bg-[#C8102E]/25 text-[#FF6B7D] text-xs font-black">PERDENTE</span>`
            : `<span class="px-2.5 py-1 rounded-lg border border-[#C8102E]/60 bg-[#C8102E]/15 text-[#FF8A98] text-xs font-black">Quota ${calc.ticketA.quotaTot.toFixed(2)}</span>`;

      const bBadge = closedB
        ? `<span class="px-2.5 py-1 rounded-lg ${closedB.win > 0 ? 'bg-[#22C55E] text-[#09150D]' : 'bg-[#C8102E]/25 text-[#FF6B7D]'} text-xs font-black">CHIUSA ${closedB.win > 0 ? '+' + formatEuro(closedB.win) : '0,00 €'}</span>`
        : calc.ticketB.status === 'won'
          ? `<span class="px-2.5 py-1 rounded-lg bg-[#22C55E] text-[#09150D] text-xs font-black">VINCENTE ${formatEuro(calc.ticketB.actualWin)}</span>`
          : calc.ticketB.status === 'lost'
            ? `<span class="px-2.5 py-1 rounded-lg bg-[#C8102E]/25 text-[#FF6B7D] text-xs font-black">PERDENTE</span>`
            : `<span class="px-2.5 py-1 rounded-lg border border-[#C8102E]/60 bg-[#C8102E]/15 text-[#FF8A98] text-xs font-black">Sistema 1 errore</span>`;

      let checkReportHtml = '';
      if (report) {
        const hasMismatches = Array.isArray(report.mismatches) && report.mismatches.length > 0;
        const hasUnmatched = Array.isArray(report.unmatched) && report.unmatched.length > 0;
        const matchedCount = Array.isArray(report.matched) ? report.matched.length : 0;

        checkReportHtml = `
          <div class="p-3 rounded-2xl border ${hasMismatches ? 'bg-amber-500/10 border-amber-500/40' : 'bg-[#22C55E]/10 border-[#22C55E]/35'} space-y-2">
            <div class="flex items-center justify-between gap-2">
              <span class="text-xs font-extrabold ${hasMismatches ? 'text-amber-300' : 'text-[#4ADE80]'}">
                ${hasMismatches ? `⚠️ Check Quote: ${report.mismatches.length} differenz${report.mismatches.length === 1 ? 'a' : 'e'} su cedolino` : `✅ Check Quote: tutte allineate (${matchedCount} OK)`}
              </span>
              <button type="button" onclick="dismissReceiptReport()" class="text-[11px] text-gray-400 hover:text-white">✕</button>
            </div>

            ${hasMismatches ? `
              <div class="space-y-1.5">
                ${report.mismatches.map(m => `
                  <div class="flex items-center justify-between gap-2 p-2 rounded-xl bg-black/30 text-[11px]">
                    <div class="min-w-0">
                      <div class="font-bold text-white truncate">${escapeHtml(m.partita)}</div>
                      <div class="text-gray-400">App: <span class="line-through">${m.appQuota.toFixed(2)}</span> → Cedolino: <strong class="text-amber-300">${m.receiptQuota.toFixed(2)}</strong></div>
                    </div>
                    <button type="button" onclick="updatePickFinalQuota('${m.pickId}', '${m.receiptQuota}')"
                      class="px-2.5 py-1 rounded-lg bg-amber-400 text-[#121212] font-extrabold text-[10px] shrink-0">
                      Allinea
                    </button>
                  </div>
                `).join('')}
              </div>
              <button type="button" onclick="applyAllReceiptQuotas()"
                class="w-full py-2 rounded-xl bg-amber-400 hover:bg-amber-300 text-[#121212] font-extrabold text-xs transition">
                Allinea tutte le quote ai cedolini (${report.mismatches.length})
              </button>
            ` : ''}

            ${hasUnmatched ? `
              <div class="text-[10px] text-gray-400 pt-1 border-t border-white/10">
                Non abbinate automaticamente: ${report.unmatched.map(u => `${escapeHtml(u.partita)} (@${u.receiptQuota.toFixed(2)})`).join(', ')}
              </div>
            ` : ''}
          </div>
        `;
      }

      const receiptsHtml = receipts.length === 0
        ? `<div class="text-[11px] text-gray-500 py-2">Nessun cedolino caricato ancora per questa puntata.</div>`
        : `<div class="grid grid-cols-2 sm:grid-cols-3 gap-2 mt-2">
            ${receipts.map(rc => {
              const imgSrc = rc.url || rc.dataUrl;
              const isCheckingThis = state.checkingReceiptId === rc.id;
              return `
                <div class="relative rounded-xl overflow-hidden border border-white/10 bg-[#121212] flex flex-col">
                  <button type="button" onclick="openReceiptPreview('${rc.id}')" class="block w-full text-left">
                    <img src="${imgSrc}" alt="${escapeHtml(rc.name)}" class="w-full h-24 object-cover" />
                    <div class="px-2 pt-1.5 text-[10px] text-gray-300 truncate">${escapeHtml(rc.name)}</div>
                  </button>
                  <div class="p-1.5 flex items-center justify-between gap-1">
                    <button type="button" onclick="recheckExistingReceipt('${rc.id}')" ${isCheckingThis ? 'disabled' : ''}
                      class="flex-1 py-1 rounded-lg bg-[#C8102E]/20 hover:bg-[#C8102E]/30 text-[#FF8A98] font-bold text-[10px] transition">
                      ${isCheckingThis ? 'Verifica...' : '🔍 Check quote'}
                    </button>
                    <button type="button" onclick="deleteReceipt('${rc.id}')" aria-label="Rimuovi cedolino"
                      class="px-2 py-1 rounded-lg bg-red-500/15 text-red-400 hover:text-white text-[10px] font-bold">✕</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>`;

      return `
        <input id="result-screen-input-A" type="file" accept="image/*" class="hidden" onchange="handleResultScreenshotChange(event, 'A')" />
        <input id="result-screen-input-B" type="file" accept="image/*" class="hidden" onchange="handleResultScreenshotChange(event, 'B')" />

        ${batchSelectorHtml}

        <div class="grid grid-cols-2 gap-2.5">
          <button onclick="copyWhatsAppSummary()" class="py-3 px-3 rounded-2xl bg-[#1C1517] hover:bg-[#261C1F] border border-[#C8102E]/25 text-white font-bold text-xs flex items-center justify-center gap-1.5 transition active:scale-[0.98]">
            <span>📋</span> Copia WhatsApp
          </button>
          ${isDraftView ? `
            <button onclick="markTicketAsPlayed()" class="py-3 px-3 rounded-2xl bg-gradient-to-r from-[#C8102E] to-[#9E0B22] hover:from-[#E01938] hover:to-[#B50D28] text-white font-extrabold text-xs flex items-center justify-center gap-1.5 transition active:scale-[0.98]">
              <span>🎟️</span> Segna come Giocata

    function renderCassaTab() {
      const txs = state.transactions || [];

      let totalBet = 0;
      let totalWon = 0;
      let totalAdjust = 0;

      state.settings.players.forEach(p => { depositedByPlayer[p.id] = 0; });

      txs.forEach(t => {
        const amt = Number(t.amount) || 0;
        if (t.type === 'deposit') {
          totalDeposited += amt;
          if (t.playerId) depositedByPlayer[t.playerId] = (depositedByPlayer[t.playerId] || 0) + amt;
        } else if (t.type === 'bet') {
          totalBet += Math.abs(amt);
        } else if (t.type === 'win') {
          totalWon += amt;
        } else {
          totalAdjust += amt;
        }
      });

      const currentBalance = totalDeposited - totalBet + totalWon + totalAdjust;

      const playerDepositsHtml = state.settings.players.map(p => {
        const dep = depositedByPlayer[p.id] || 0;
        return `
