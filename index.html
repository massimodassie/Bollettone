    // --- TAB 5: STATISTICHE + 2 GRAFICI (ISTOGRAMMA DIVERGENTE PRESE/PERSE PER PERSONA + ANDAMENTO BILANCIO) ---
    function renderDivergentPlayerChart(playerStats) {
      if (!playerStats || playerStats.length === 0) {
        return `<div class="text-xs text-gray-500 py-6 text-center">Nessun dato giocatore disponibile.</div>`;
      }

      const maxAbs = Math.max(
        1,
        ...playerStats.map(p => Math.max(p.won, p.lost))
      );

      const colsHtml = playerStats.map(ps => {
        const wonPct = Math.min(100, (ps.won / maxAbs) * 100);
        const lostPct = Math.min(100, (ps.lost / maxAbs) * 100);
        const net = ps.won - ps.lost;
        const netColor = net > 0 ? 'text-[#4ADE80]' : net < 0 ? 'text-[#FF6B7D]' : 'text-gray-400';

        return `
          <div class="flex flex-col items-center min-w-[64px] flex-1">
            <div class="text-[10px] font-black text-[#4ADE80] h-4">${ps.won > 0 ? `+${ps.won}` : '0'}</div>

            <!-- Metà superiore: sale verso l'alto per le prese -->
            <div class="w-full h-24 flex items-end justify-center pt-1">
              <div class="w-7 sm:w-8 rounded-t-lg bg-gradient-to-t from-[#16A34A] to-[#4ADE80] transition-all duration-500"
                style="height: ${wonPct}%"></div>
            </div>

            <!-- Linea zero centrale -->
            <div class="w-full h-0.5 bg-[#C8102E]/60"></div>

            <!-- Metà inferiore: scende verso il basso per le perse -->
            <div class="w-full h-24 flex items-start justify-center pb-1">
              <div class="w-7 sm:w-8 rounded-b-lg bg-gradient-to-b from-[#E01938] to-[#88081C] transition-all duration-500"
                style="height: ${lostPct}%"></div>
            </div>

            <div class="text-[10px] font-black text-[#FF6B7D] h-4">${ps.lost > 0 ? `-${ps.lost}` : '0'}</div>
            <div class="text-[11px] font-extrabold text-white truncate max-w-full mt-1">${escapeHtml(ps.name.split(' ')[0])}</div>
            <div class="text-[10px] font-bold ${netColor}">${net > 0 ? `+${net}` : net}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="p-3.5 rounded-2xl bg-[#121212] border border-white/10 space-y-3">
          <div class="flex items-center justify-between gap-2 text-[10px] font-bold">
            <span class="text-[#4ADE80]">▲ Sopra zero: Puntate Prese</span>
            <span class="text-[#FF6B7D]">▼ Sotto zero: Puntate Perse</span>
          </div>
          <div class="flex items-end justify-between gap-2 overflow-x-auto no-scrollbar pt-1">
            ${colsHtml}
          </div>
        </div>
      `;
    }

    function renderProfitTrendChart(history) {
      const closedList = (history || []).slice().reverse();
      if (closedList.length === 0) {
        return `<div class="text-xs text-gray-500 py-6 text-center">Chiudi almeno una schedina per vedere l'andamento del bilancio.</div>`;
      }

      let runningNet = 0;
      const points = closedList.map((h, idx) => {
        const stake = Number(h.totalStake) || 5;
        const win = Number(h.totalWin) || 0;
        runningNet = Number((runningNet + (win - stake)).toFixed(2));
        return {
          idx: idx + 1,
          label: h.dateStr || `#${idx + 1}`,
          runningNet,
          win
        };
      });

      const maxAbsVal = Math.max(10, ...points.map(p => Math.abs(p.runningNet)));

      const barsHtml = points.map(pt => {
        const isPos = pt.runningNet >= 0;
        const pct = Math.min(100, (Math.abs(pt.runningNet) / maxAbsVal) * 100);
        return `
          <div class="flex flex-col items-center min-w-[54px] flex-1">
            <div class="text-[9px] font-black ${isPos ? 'text-[#4ADE80]' : 'text-[#FF6B7D]'} mb-1">
              ${isPos ? '+' : ''}${pt.runningNet.toFixed(0)}€
            </div>
            <div class="w-full h-28 flex items-end justify-center bg-white/[0.02] rounded-xl p-1">
              <div class="w-6 rounded-t-md transition-all duration-500 ${
                isPos
                  ? 'bg-gradient-to-t from-[#C8102E] to-[#FF6B7D]'
                  : 'bg-gradient-to-t from-[#7F1D1D] to-[#EF4444]'
              }" style="height: ${Math.max(8, pct)}%"></div>
            </div>
            <div class="text-[9px] text-gray-400 font-semibold mt-1 truncate max-w-full">${escapeHtml(pt.label)}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="p-3.5 rounded-2xl bg-[#121212] border border-white/10 space-y-2">
          <div class="flex items-center justify-between text-[10px] text-gray-400">
            <span>Profitto netto progressivo (€)</span>
            <span class="font-bold text-[#FF8A98]">${points.length} chiusur${points.length === 1 ? 'a' : 'e'}</span>
          </div>
          <div class="flex items-end justify-between gap-2 overflow-x-auto no-scrollbar pt-1">
            ${barsHtml}
          </div>
        </div>
      `;
    }

    function renderStatisticheTab() {
      const history = state.history || [];
      const currentPicks = getActiveSchedineBatch().picks || [];
      const txs = state.transactions || [];

      const totalEntries = history.length;
      const winsA = history.filter(h => h.schedinaA?.won).length;
      const winsB = history.filter(h => h.schedinaB?.won).length;
      const countA = history.filter(h => !!h.schedinaA).length;
      const countB = history.filter(h => !!h.schedinaB).length;
      const winRateA = countA > 0 ? (winsA / countA) * 100 : 0;
      const winRateB = countB > 0 ? (winsB / countB) * 100 : 0;

      const totalStaked = history.reduce((acc, h) => acc + (Number(h.totalStake) || 5), 0);
      const totalWon = history.reduce((acc, h) => acc + (Number(h.totalWin) || 0), 0);
      const netProfit = totalWon - totalStaked;
      const roi = totalStaked > 0 ? (netProfit / totalStaked) * 100 : 0;

      const allResolved = [];
      history.slice().reverse().forEach(h => {
        (h.picks || []).forEach(pk => {
          if (pk.status === 'won' || pk.status === 'lost') allResolved.push(pk);
        });
      });
      currentPicks.forEach(pk => {
        if (pk.status === 'won' || pk.status === 'lost') allResolved.push(pk);
      });

      const globalWonMatches = allResolved.filter(p => p.status === 'won').length;
      const globalHitRate = allResolved.length > 0 ? (globalWonMatches / allResolved.length) * 100 : 0;

      const depositedByPlayer = {};
      txs.forEach(t => {
        if (t.type === 'deposit' && t.playerId) {
          depositedByPlayer[t.playerId] = (depositedByPlayer[t.playerId] || 0) + (Number(t.amount) || 0);
        }
      });

      const playerStats = state.settings.players.map(p => {
        const myPicks = allResolved.filter(pk => pk.playerId === p.id);
        const total = myPicks.length;
        const wonList = myPicks.filter(pk => pk.status === 'won');
        const lost = total - wonList.length;
        const won = wonList.length;
        const hitRate = total > 0 ? (won / total) * 100 : 0;
        const avgPlayed = total > 0 ? myPicks.reduce((a, x) => a + Number(x.quota), 0) / total : 0;
        const avgWon = won > 0 ? wonList.reduce((a, x) => a + Number(x.quota), 0) / won : 0;
        const maxWon = won > 0 ? Math.max(...wonList.map(x => Number(x.quota))) : 0;
        const deposited = depositedByPlayer[p.id] || 0;
        return { ...p, total, won, lost, hitRate, avgPlayed, avgWon, maxWon, deposited };
      });

      playerStats.sort((a, b) => (b.hitRate - a.hitRate) || (b.won - a.won));

      const leaderboardHtml = playerStats.map((ps, idx) => {
        const medal = idx === 0 && ps.total > 0 ? '🥇' : idx === 1 && ps.total > 0 ? '🥈' : idx === 2 && ps.total > 0 ? '🥉' : `#${idx + 1}`;
        return `
          <div class="p-3.5 rounded-2xl bg-[#121212] border border-white/10 space-y-3">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2.5">
                <span class="text-base font-black w-6 text-center text-gray-400">${medal}</span>
                <div>
                  <div class="font-bold text-sm text-white">${escapeHtml(ps.name)}</div>
                  <div class="text-[11px] text-gray-400">
                    <span class="text-[#4ADE80] font-bold">${ps.won} prese</span> · <span class="text-[#FF6B7D] font-bold">${ps.lost} perse</span> (${ps.total} tot)
                  </div>
                </div>
              </div>
              <div class="text-right">
                <div class="font-black text-lg text-[#FF6B7D] leading-none">${ps.hitRate.toFixed(0)}%</div>
                <div class="text-[10px] text-gray-500 mt-0.5">Precisione</div>
              </div>
            </div>

            <div class="w-full h-2 rounded-full bg-white/5 overflow-hidden">
              <div class="h-full rounded-full bg-gradient-to-r from-[#C8102E] to-[#FF6B7D] transition-all duration-500" style="width: ${ps.hitRate}%"></div>
            </div>

            <div class="grid grid-cols-4 gap-1.5 pt-1 text-center">
              <div class="p-1.5 rounded-lg bg-[#1C1517]">
                <div class="text-[9px] text-gray-500 uppercase">Q. Media</div>
                <div class="text-xs font-bold text-white">${ps.avgPlayed > 0 ? ps.avgPlayed.toFixed(2) : '-'}</div>
              </div>
              <div class="p-1.5 rounded-lg bg-[#1C1517]">
                <div class="text-[9px] text-gray-500 uppercase">Q. Presa</div>
                <div class="text-xs font-bold text-[#4ADE80]">${ps.avgWon > 0 ? ps.avgWon.toFixed(2) : '-'}</div>
              </div>
              <div class="p-1.5 rounded-lg bg-[#1C1517]">
                <div class="text-[9px] text-gray-500 uppercase">Max Presa</div>
                <div class="text-xs font-bold text-amber-400">${ps.maxWon > 0 ? ps.maxWon.toFixed(2) : '-'}</div>
              </div>
              <div class="p-1.5 rounded-lg bg-[#1C1517]">
                <div class="text-[9px] text-gray-500 uppercase">Versato</div>
                <div class="text-xs font-bold text-white">${ps.deposited.toFixed(0)} €</div>
              </div>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="rounded-3xl bg-[#1C1517] border border-[#C8102E]/30 p-4 space-y-3">
          <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Statistiche Globali Gruppo</h2>

          <div class="grid grid-cols-2 gap-2.5">
            <div class="p-3.5 rounded-2xl bg-[#121212] border border-white/5">
              <div class="text-[11px] text-gray-400">Profitto Netto</div>
              <div class="font-black text-xl mt-0.5 ${netProfit >= 0 ? 'text-[#4ADE80]' : 'text-[#FF6B7D]'}">
                ${netProfit >= 0 ? '+' : ''}${formatEuro(netProfit)}
              </div>
            </div>
            <div class="p-3.5 rounded-2xl bg-[#121212] border border-white/5">
              <div class="text-[11px] text-gray-400">ROI Totale</div>
              <div class="font-black text-xl mt-0.5 ${roi >= 0 ? 'text-[#4ADE80]' : 'text-[#FF6B7D]'}">
                ${roi >= 0 ? '+' : ''}${roi.toFixed(1)}%
              </div>
            </div>
          </div>

          <div class="grid grid-cols-4 gap-2 text-center">
            <div class="p-2 rounded-xl bg-[#121212]">
              <div class="text-[9px] text-gray-400 uppercase">Chiuse</div>
              <div class="font-black text-sm text-white mt-0.5">${totalEntries}</div>
            </div>
            <div class="p-2 rounded-xl bg-[#121212]">
              <div class="text-[9px] text-gray-400 uppercase">Win A</div>
              <div class="font-black text-sm text-[#4ADE80] mt-0.5">${winRateA.toFixed(0)}%</div>
            </div>
            <div class="p-2 rounded-xl bg-[#121212]">
              <div class="text-[9px] text-gray-400 uppercase">Win B</div>
              <div class="font-black text-sm text-[#4ADE80] mt-0.5">${winRateB.toFixed(0)}%</div>
            </div>
            <div class="p-2 rounded-xl bg-[#121212]">
              <div class="text-[9px] text-gray-400 uppercase">Hit Match</div>
              <div class="font-black text-sm text-amber-400 mt-0.5">${globalHitRate.toFixed(0)}%</div>
            </div>
          </div>
        </div>

        <!-- Grafico 1: Istogramma Divergente Prese (+) / Perse (-) per Persona -->
        <div class="rounded-3xl bg-[#1C1517] border border-[#C8102E]/30 p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Prese (+) vs Perse (-) per Persona</h2>
            <span class="text-[10px] text-[#FF8A98] font-bold">Istogramma Giocatori</span>
          </div>
          ${renderDivergentPlayerChart(playerStats)}
        </div>

        <!-- Grafico 2: Andamento Profitto Netto nel Tempo -->
        <div class="rounded-3xl bg-[#1C1517] border border-[#C8102E]/30 p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Andamento Profitto Netto</h2>
            <span class="text-[10px] text-gray-500">Storico chiusure</span>
          </div>
          ${renderProfitTrendChart(history)}
        </div>

        <div class="rounded-3xl bg-[#1C1517] border border-white/10 p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h2 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Classifica Precisione Utenti</h2>
            <span class="text-[10px] text-gray-500">Include esiti live</span>
          </div>
          ${leaderboardHtml}
        </div>
      `;
    }

    function getPlayerName(id) {
      return state.settings.players.find(x => x.id === id)?.name || 'Giocatore';
    }

    function normalizeMatch(str) {
      return String(str || '').toLowerCase().replace(/[^a-z0-9]/g, '');
    }

    function formatEuro(num) {
      const n = Number(num) || 0;
      return n.toLocaleString('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function escapeJs(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;
      const el = document.createElement('div');
      const colors = {
        success: 'bg-[#22C55E] text-[#09150D] font-bold',
        error: 'bg-[#C8102E] text-white font-bold',
        warning: 'bg-amber-400 text-[#121212] font-bold',
        info: 'bg-[#2A1D20] text-white border border-[#C8102E]/40 font-semibold'
      };
      el.className = `px-4 py-3 rounded-2xl text-xs shadow-2xl pointer-events-auto transition-all duration-300 ${colors[type] || colors.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-8px)';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    function syncSystemTheme() {
      const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
      document.documentElement.classList.toggle('dark', !prefersLight);
    }
    syncSystemTheme();
    if (window.matchMedia) {
      window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', syncSystemTheme);
    }
    window.addEventListener('DOMContentLoaded', () => {
      render();
      initFirebase();
      fetchLeagueMatches(state.selectedLeague);
    });
  </script>
</body>
</html>
